<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>而而与钶钶 · 书房</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我们的书房">
<meta name="theme-color" content="#fdf8f5">
<link rel="apple-touch-icon" href="icon-books-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="icon-books-180.png">
<link rel="apple-touch-icon" sizes="512x512" href="icon-books.png">
<link rel="icon" type="image/png" href="icon-books-180.png">
<link rel="manifest" href="books-manifest.json">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #fdf8f5;
  --card: #fff;
  --primary: #d4896a;
  --primary-light: #f5e6df;
  --text: #3a2e2a;
  --text-light: #9a8580;
  --erere: #7dc49a;
  --keke: #8faec4;
  --erere-hl: #d6f0e2;
  --keke-hl: #d9e7f1;
  --both-hl: #e6e9d8;
  --border: #ede5e0;
  --shadow: 0 2px 16px rgba(100,60,40,0.08);
  --read-size: 17px;
  --read-lh: 1.9;
}

body.night {
  --bg: #1a1715;
  --card: #241f1d;
  --primary: #c98a6d;
  --primary-light: #332a26;
  --text: #d8cec8;
  --text-light: #7d716b;
  --erere-hl: #2c4a3a;
  --keke-hl: #2a3d4a;
  --both-hl: #3d4034;
  --border: #322b28;
  --shadow: 0 2px 16px rgba(0,0,0,0.3);
}

body {
  font-family: -apple-system, 'PingFang SC', 'Hiragino Sans GB', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  max-width: 480px;
  margin: 0 auto;
  transition: background .3s, color .3s;
  padding-bottom: env(safe-area-inset-bottom);
}

.view { display: none; }
.view.on { display: block; }

/* ---------- 顶栏 ---------- */
.nav {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: 10px;
  padding: 14px 16px calc(14px) 16px;
  padding-top: calc(14px + env(safe-area-inset-top));
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: saturate(180%) blur(14px);
  -webkit-backdrop-filter: saturate(180%) blur(14px);
  border-bottom: 1px solid var(--border);
}
.nav h1 {
  font-size: 17px; font-weight: 600; flex: 1; letter-spacing: .5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0;
}
.nav .sub { font-size: 12px; color: var(--text-light); font-weight: 400; margin-left: 6px; }
.iconbtn {
  border: none; background: none; color: var(--text-light);
  font-size: 20px; line-height: 1; padding: 6px 8px; cursor: pointer;
  border-radius: 10px; font-family: inherit;
}
.iconbtn:active { background: var(--primary-light); }
.iconbtn.txt { font-size: 14px; }

/* ---------- 通用 ---------- */
.wrap { padding: 16px; }
.btn {
  border: none; border-radius: 12px; padding: 13px 20px;
  font-size: 15px; font-family: inherit; cursor: pointer;
  background: var(--primary); color: #fff; font-weight: 500;
}
.btn:active { opacity: .82; }
.btn.ghost { background: var(--card); color: var(--text); border: 1px solid var(--border); }
.btn.wide { display: block; width: 100%; }
input[type=text], input[type=password], textarea {
  width: 100%; border: 1px solid var(--border); border-radius: 12px;
  padding: 13px 14px; font-size: 15px; font-family: inherit;
  background: var(--card); color: var(--text); outline: none;
}
input:focus, textarea:focus { border-color: var(--primary); }
.hint { font-size: 12.5px; color: var(--text-light); line-height: 1.7; }
.empty { text-align: center; color: var(--text-light); padding: 70px 24px; font-size: 14px; line-height: 1.9; }
.shelf .empty { grid-column: 1 / -1; }

/* ---------- 设置页 ---------- */
#setup .wrap { padding-top: 40px; }
.setup-title { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
.setup-sub { font-size: 14px; color: var(--text-light); line-height: 1.8; margin-bottom: 28px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--text-light); margin-bottom: 8px; }

/* ---------- 首页 ---------- */
.wrap.home { padding: 0 18px 40px 18px; padding-top: calc(58px + env(safe-area-inset-top)); }
.home .hi { font-size: 14px; color: var(--text-light); margin-bottom: 6px; }
.home-name { font-size: 25px; font-weight: 600; letter-spacing: .5px; margin-bottom: 30px; }

.cont {
  background: var(--card); border: 1px solid var(--border); border-radius: 18px;
  padding: 18px; box-shadow: var(--shadow); cursor: pointer; margin-bottom: 14px;
}
.cont:active { transform: scale(.985); }
.cont .tag { font-size: 12px; color: var(--primary); margin-bottom: 9px; letter-spacing: .5px; }
.cont h3 { font-size: 17px; font-weight: 600; line-height: 1.5; margin-bottom: 12px; }
.cont .meta { font-size: 12.5px; color: var(--text-light); margin-bottom: 10px; }

.voice { margin-bottom: 14px; }
.voice .tag { font-size: 12px; color: var(--text-light); margin: 0 0 9px 2px; letter-spacing: .5px; }
.voice .inote { margin: 0 0 8px 0; }

.entry {
  display: flex; align-items: center; justify-content: space-between;
  background: var(--card); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px 18px; margin-bottom: 11px; cursor: pointer;
}
.entry:active { background: var(--primary-light); }
.entry b { font-size: 15.5px; font-weight: 600; }
.entry span { font-size: 12.5px; color: var(--text-light); margin-left: 9px; }
.entry i { font-style: normal; font-size: 19px; color: var(--text-light); }
.home-foot { text-align: center; margin-top: 26px; }

/* ---------- 书架 ---------- */
.shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px 11px; }
.bookcard { cursor: pointer; position: relative; }
.bookcard:active .cover { transform: scale(.97); }

/* 没有封面图，就按书名生成一张 */
.cover {
  aspect-ratio: 3 / 4.2; min-height: 148px; border-radius: 7px;
  background: hsl(var(--h), 30%, 87%);
  color: hsl(var(--h), 48%, 25%);
  box-shadow: 0 2px 9px rgba(100,60,40,.16);
  padding: 14px 11px 13px 11px; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative; transition: transform .15s;
  border-left: 3px solid hsl(var(--h), 40%, 72%);
}
body.night .cover {
  background: hsl(var(--h), 15%, 22%);
  color: hsl(var(--h), 28%, 76%);
  border-left-color: hsl(var(--h), 22%, 33%);
  box-shadow: 0 2px 9px rgba(0,0,0,.34);
}
.cv-main {
  font-size: 13px; font-weight: 600; line-height: 1.5; letter-spacing: .3px;
  display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden;
}
.cv-sub {
  font-size: 9.5px; opacity: .62; line-height: 1.45; letter-spacing: .2px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.cv-bar {
  position: absolute; left: 3px; right: 0; bottom: 0; height: 3px;
  background: rgba(0,0,0,.07); border-radius: 0 0 8px 0; overflow: hidden;
}
.cv-bar i { display: block; height: 100%; background: hsl(var(--h), 40%, 52%); }
.bookfoot { margin-top: 7px; font-size: 10.5px; color: var(--text-light); line-height: 1.5; }
.bookfoot .n { display: inline-block; margin-right: 7px; }
.dot-e { color: var(--erere); }
.dot-k { color: var(--keke); }
.progbar { height: 3px; background: var(--border); border-radius: 2px; margin-top: 12px; overflow: hidden; }
.progbar i { display: block; height: 100%; background: var(--primary); border-radius: 2px; }
.newdot {
  position: absolute; top: -4px; right: -4px; z-index: 2;
  width: 10px; height: 10px; border-radius: 50%; background: var(--keke);
  border: 2px solid var(--bg);
}

/* ---------- 阅读页 ---------- */
#reader .page {
  padding: 20px 20px 120px 20px;
  font-size: var(--read-size); line-height: var(--read-lh);
}
/* Safari 浏览器里，底部那条地址栏会压住 fixed 元素，
   整体往上让一截；加到主屏幕之后没有它，就不让。 */
body.chrome-bar #reader .page { padding-bottom: 176px; }
.para { margin-bottom: 1.15em; position: relative; }
.para .pid {
  font-size: 11px; color: var(--text-light); opacity: .45;
  margin-right: 6px; user-select: none; -webkit-user-select: none;
}

/* 书前目次：点一下就翻过去 */
.tocitem {
  position: relative; padding: 13px 26px 13px 2px;
  border-bottom: 1px solid var(--border);
  font-size: 15px; line-height: 1.6; cursor: pointer;
  user-select: none; -webkit-user-select: none;
}
.tocitem::after {
  content: '›'; position: absolute; right: 6px; top: 50%;
  transform: translateY(-50%); color: var(--text-light); font-size: 20px;
}
.tocitem:active { background: var(--primary-light); }
.tocitem.chap { font-weight: 600; margin-top: 6px; }
mark.hl { background: transparent; color: inherit; border-radius: 3px; padding: 1px 0; }
mark.hl-e { background: var(--erere-hl); }
mark.hl-k { background: var(--keke-hl); }
mark.hl-b { background: var(--both-hl); }

/* 底下挂着话的，只划一道虚线；点它才展开 */
mark.nl {
  background: transparent; color: inherit; cursor: pointer;
  border-bottom: 1.6px dashed; padding-bottom: 1px;
}
mark.nl-e { border-color: var(--erere); }
mark.nl-k { border-color: var(--keke); }
mark.nl-b { border-color: var(--primary); }
.pid.talk { opacity: .9; color: var(--primary); cursor: pointer; }
.notes { margin: -.25em 0 1.15em 0; }
.para.has-note::after {
  content: ''; position: absolute; left: -12px; top: 4px;
  width: 3px; height: calc(100% - 8px); border-radius: 2px; background: var(--primary-light);
}

/* 批注直接长在段落底下，不用去别处翻 */
.inote {
  margin: -0.35em 0 1.15em 16px; padding: 11px 13px;
  background: var(--card); border: 1px solid var(--border);
  border-left: 3px solid var(--keke); border-radius: 12px;
  font-size: 14px; line-height: 1.75;
}
.inote.e { border-left-color: var(--erere); }
.inote.reply { margin-left: 34px; }
.inote-h { font-size: 12px; font-weight: 600; color: var(--keke); margin-bottom: 5px; }
.inote.e .inote-h { color: var(--erere); }
.inote-h span { font-weight: 400; color: var(--text-light); margin-left: 6px; }
.inote-b { white-space: pre-wrap; word-break: break-word; font-style: italic; }
.inote-a { margin-top: 8px; display: flex; gap: 16px; }
.inote-a button {
  border: none; background: none; padding: 0; cursor: pointer;
  font-size: 12.5px; color: var(--text-light); font-family: inherit;
}

.pagefoot {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; z-index: 30;
  display: flex; align-items: center; gap: 8px;
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom)) 14px;
  background: color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
.pagefoot .pg { flex: 1; text-align: center; font-size: 12.5px; color: var(--text-light); }
.pagefoot .btn { padding: 9px 18px; font-size: 14px; border-radius: 10px; }
body.chrome-bar .pagefoot { padding-bottom: calc(10px + env(safe-area-inset-bottom) + 52px); }
/* 选中文字时把翻页条收起来，免得和工具条叠在一起 */
body.picking .pagefoot { opacity: 0; pointer-events: none; }
.pagefoot { transition: opacity .18s; }

/* ---------- 叫钶钶 ---------- */
.fab {
  position: fixed; right: 16px; z-index: 55;
  bottom: calc(86px + env(safe-area-inset-bottom));
  width: 46px; height: 46px; border-radius: 50%;
  background: var(--keke); color: #fff; border: none;
  font-size: 18px; font-weight: 600; font-family: inherit; cursor: pointer;
  box-shadow: 0 4px 14px rgba(100,60,40,.26);
  transition: opacity .18s, transform .15s;
}
.fab:active { transform: scale(.92); }
body.chrome-bar .fab { bottom: calc(86px + env(safe-area-inset-bottom) + 52px); }
body.picking .fab { opacity: 0; pointer-events: none; }
.callbox { font-size: 13.5px; line-height: 1.75; color: var(--text-light); margin-bottom: 14px; }
.callbox b { color: var(--text); }

/* ---------- 选中工具条 ---------- */
#selbar {
  position: fixed; left: 50%; transform: translateX(-50%) translateY(140%);
  bottom: calc(14px + env(safe-area-inset-bottom));
  width: calc(100% - 28px); max-width: 452px; z-index: 60;
  background: var(--card); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: 0 6px 24px rgba(100,60,40,.16);
  padding: 12px 14px;
  /* 收起时彻底藏干净：光靠位移会在安全区上露一道边 */
  opacity: 0; visibility: hidden; pointer-events: none;
  transition: transform .22s ease, opacity .22s ease, visibility .22s;
}
#selbar.on {
  transform: translateX(-50%) translateY(0);
  opacity: 1; visibility: visible; pointer-events: auto;
}
body.chrome-bar #selbar { bottom: calc(14px + env(safe-area-inset-bottom) + 52px); }
#selbar .quote {
  font-size: 13px; color: var(--text-light); line-height: 1.6;
  margin-bottom: 10px; max-height: 3.2em; overflow: hidden;
}
#selbar .row { display: flex; gap: 8px; }
#selbar .row .btn { flex: 1; padding: 10px 0; font-size: 14px; border-radius: 10px; }

/* ---------- 抽屉 ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 80; display: none;
  background: rgba(40,25,20,.34);
}
.sheet.on { display: block; }
.sheet-in {
  position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 480px; max-height: 82vh; overflow-y: auto;
  background: var(--bg); border-radius: 22px 22px 0 0;
  padding: 18px 18px calc(24px + env(safe-area-inset-bottom)) 18px;
  animation: up .25s ease;
}
@keyframes up { from { transform: translateX(-50%) translateY(100%); } }
.sheet-h { display: flex; align-items: center; margin-bottom: 14px; }
.sheet-h b { font-size: 16px; flex: 1; }

.note {
  background: var(--card); border-radius: 14px; padding: 13px 14px;
  margin-bottom: 10px; border: 1px solid var(--border);
}
.note-h { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; }
.note-au { font-size: 13px; font-weight: 600; }
.note-au.e { color: var(--erere); }
.note-au.k { color: var(--keke); }
.note-t { font-size: 11px; color: var(--text-light); flex: 1; }
.note-q {
  font-size: 12.5px; color: var(--text-light); line-height: 1.6;
  padding-left: 9px; border-left: 2px solid var(--border); margin-bottom: 7px;
}
.note-b { font-size: 14.5px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; }
.note-acts { display: flex; gap: 14px; margin-top: 9px; }
.note-acts button {
  border: none; background: none; padding: 0; cursor: pointer;
  font-size: 12.5px; color: var(--text-light); font-family: inherit;
}
.note.reply { margin-left: 18px; border-left: 2px solid var(--primary-light); }

.seg { display: flex; gap: 6px; margin-bottom: 14px; }
.seg button {
  flex: 1; border: 1px solid var(--border); background: var(--card);
  color: var(--text-light); border-radius: 10px; padding: 8px 0;
  font-size: 13px; font-family: inherit; cursor: pointer;
}
.seg button.on { background: var(--primary); color: #fff; border-color: var(--primary); }

.srow {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 2px; border-bottom: 1px solid var(--border); font-size: 15px;
}
.srow:last-child { border-bottom: none; }
.stepper { display: flex; align-items: center; gap: 4px; }
.stepper button {
  width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--border);
  background: var(--card); color: var(--text); font-size: 17px; cursor: pointer; font-family: inherit;
}
.switch { width: 46px; height: 27px; border-radius: 14px; background: var(--border); position: relative; cursor: pointer; border: none; }
.switch i { position: absolute; top: 3px; left: 3px; width: 21px; height: 21px; border-radius: 50%; background: #fff; transition: left .2s; }
.switch.on { background: var(--primary); }
.switch.on i { left: 22px; }

/* 目录抽屉 */
.tocrow {
  display: flex; align-items: baseline; gap: 10px;
  padding: 12px 2px; border-bottom: 1px solid var(--border); cursor: pointer;
}
.tocrow:active { background: var(--primary-light); }
.tocrow span { flex: 1; font-size: 14.5px; line-height: 1.6; }
.tocrow i { font-style: normal; font-size: 12px; color: var(--text-light); }
.tocrow.chap span { font-weight: 600; }
.tocrow.here span { color: var(--primary); font-weight: 600; }
.tocrow.here i { color: var(--primary); }

.sr { padding: 12px 2px; border-bottom: 1px solid var(--border); cursor: pointer; }
.sr .sr-p { font-size: 11.5px; color: var(--text-light); margin-bottom: 4px; }
.sr .sr-t { font-size: 14px; line-height: 1.6; }
.sr em { font-style: normal; background: var(--primary-light); border-radius: 3px; padding: 0 2px; }

/* ---------- toast / loading ---------- */
#toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(20px);
  background: rgba(58,46,42,.94); color: #fff; padding: 11px 20px;
  border-radius: 12px; font-size: 14px; z-index: 200;
  opacity: 0; pointer-events: none; transition: all .24s; max-width: 82%; text-align: center;
}
#toast.on { opacity: 1; transform: translateX(-50%) translateY(0); }
#load {
  position: fixed; inset: 0; z-index: 300; display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  background: color-mix(in srgb, var(--bg) 88%, transparent);
}
#load.on { display: flex; }
.spin {
  width: 26px; height: 26px; border: 2.5px solid var(--border);
  border-top-color: var(--primary); border-radius: 50%; animation: sp .8s linear infinite;
}
@keyframes sp { to { transform: rotate(360deg); } }
#load span { font-size: 13.5px; color: var(--text-light); }
</style>
</head>
<body>

<!-- ============ 设置 ============ -->
<div class="view" id="setup">
  <div class="wrap">
    <div class="setup-title">而而与钶钶 · 书房</div>
    <div class="setup-sub">第一次进来，填一次钥匙就好。<br>它只存在这台设备里，不会上传，不会进代码。</div>
    <div class="field">
      <label>GitHub Token</label>
      <input type="password" id="tokIn" placeholder="github_pat_..." autocomplete="off" autocapitalize="off" spellcheck="false">
    </div>
    <button class="btn wide" id="tokSave">进书房</button>
    <div class="hint" style="margin-top:20px">
      需要 <b>Contents: Read and write</b> 权限，仓库范围勾上 <b>lab</b>。<br>
      存好之后不用再填，除非换设备或者换了 token。
    </div>
  </div>
</div>

<!-- ============ 首页 ============ -->
<div class="view" id="home">
  <div class="wrap home">
    <div class="hi" id="homeHi"></div>
    <div class="home-name">而而与钶钶的书房</div>
    <div id="homeCont"></div>
    <div id="homeVoice"></div>
    <div class="entry" id="toShelf">
      <div><b>书架</b><span id="homeCount"></span></div><i>›</i>
    </div>
    <div class="entry" id="homeAdd">
      <div><b>传一本进来</b><span>.txt / .epub</span></div><i>＋</i>
    </div>
    <div class="home-foot"><button class="iconbtn txt" id="homeSet">设置</button></div>
  </div>
</div>

<!-- ============ 书架 ============ -->
<div class="view" id="shelf">
  <div class="nav">
    <button class="iconbtn" id="shelfBack">‹</button>
    <h1>书架<span class="sub" id="shelfSub"></span></h1>
    <button class="iconbtn" id="btnAdd" title="上传">＋</button>
    <button class="iconbtn txt" id="btnSet" title="设置">···</button>
  </div>
  <div class="wrap">
    <div class="shelf" id="shelfList"></div>
  </div>
  <input type="file" id="fileIn" accept=".txt,.epub,text/plain,application/epub+zip" style="display:none">
</div>

<!-- ============ 阅读 ============ -->
<div class="view" id="reader">
  <div class="nav">
    <button class="iconbtn" id="btnBack">‹</button>
    <h1 id="rTitle"></h1>
    <button class="iconbtn" id="btnToc" title="目录">☰</button>
    <button class="iconbtn" id="btnSearch">⌕</button>
    <button class="iconbtn" id="btnNotes">✎</button>
    <button class="iconbtn" id="btnPrefs">Aa</button>
  </div>
  <div class="page" id="pageBox"></div>
  <button class="fab" id="callKe" title="叫钶钶">钶</button>
  <div class="pagefoot">
    <button class="btn ghost" id="btnPrev">上一页</button>
    <div class="pg" id="pgInfo"></div>
    <button class="btn ghost" id="btnNext">下一页</button>
  </div>
</div>

<!-- 选中工具条 -->
<div id="selbar">
  <div class="quote" id="selQuote"></div>
  <div class="row">
    <button class="btn" id="selHl">划线</button>
    <button class="btn ghost" id="selNote">写批注</button>
    <button class="btn ghost" id="selVocab">生词</button>
  </div>
</div>

<!-- 抽屉 -->
<div class="sheet" id="sheet"><div class="sheet-in" id="sheetIn"></div></div>

<div id="toast"></div>
<div id="load"><div class="spin"></div><span id="loadTxt">载入中</span></div>

<script>
/* ========================================================================
   而而与钶钶 · 书房
   页面住在 kkee-diary（public，没有秘密）
   数据住在 lab/kkee-books（private）
   钥匙只住在你手机的 localStorage 里
   ======================================================================== */

const OWNER  = 'Ererhere';
const REPO   = 'lab';
const BRANCH = 'claude/baobao-cdyeuf';
const ROOT   = 'kkee-books';

const ME   = '而而';
const KEKE = '钶钶';

const API = 'https://api.github.com';
const PAGE_CHARS = 600;
const LS = { tok:'kkee_books_token', night:'kkee_books_night', size:'kkee_books_size',
             seen:'kkee_books_seen', last:'kkee_books_last' };

let TOKEN = localStorage.getItem(LS.tok) || '';

const state = {
  shelf: null, shelfSha: null,
  book: null, text: null,
  anno: null, annoSha: null,
  page: 1, sel: null, dirty: false, from: 'shelf',
};

/* ---------------- 小工具 ---------------- */
const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// 没有封面图，就用书名定一个色相——同一本书永远同一个颜色
const HUES = [16, 30, 44, 88, 150, 188, 208, 252, 288, 330];
const hueOf = s => HUES[[...s].reduce((a, c) => a + c.charCodeAt(0), 0) % HUES.length];
const now = () => new Date().toISOString();

function toast(msg, ms = 2000) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), ms);
}
function loading(on, txt = '载入中') { $('loadTxt').textContent = txt; $('load').classList.toggle('on', on); }
function show(v) { document.querySelectorAll('.view').forEach(x => x.classList.toggle('on', x.id === v)); }
function fmtTime(iso) {
  const d = new Date(iso), n = new Date();
  const same = d.toDateString() === n.toDateString();
  const p = x => String(x).padStart(2, '0');
  return same ? `${p(d.getHours())}:${p(d.getMinutes())}`
              : `${d.getMonth() + 1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------------- base64（UTF-8 安全） ---------------- */
function b64enc(str) {
  const u = new TextEncoder().encode(str);
  let bin = ''; const CH = 0x8000;
  for (let i = 0; i < u.length; i += CH) bin += String.fromCharCode.apply(null, u.subarray(i, i + CH));
  return btoa(bin);
}
function b64dec(b64) {
  const bin = atob(b64.replace(/\s/g, ''));
  const u = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(u);
}

/* ---------------- GitHub API ---------------- */
function ghHeaders() {
  return { Authorization: `Bearer ${TOKEN}`, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28' };
}
const encPath = p => p.split('/').map(encodeURIComponent).join('/');

async function ghRead(path) {
  const url = `${API}/repos/${OWNER}/${REPO}/contents/${encPath(path)}?ref=${encodeURIComponent(BRANCH)}&t=${Date.now()}`;
  const r = await fetch(url, { headers: ghHeaders(), cache: 'no-store' });
  if (r.status === 404) return null;
  if (r.status === 401) throw new Error('钥匙不对，或者已经过期了');
  if (!r.ok) throw new Error(`读取失败（${r.status}）`);
  const j = await r.json();
  if (j.content) return { text: b64dec(j.content), sha: j.sha };
  // 大文件：contents 不返回内容，走 blob
  const b = await fetch(`${API}/repos/${OWNER}/${REPO}/git/blobs/${j.sha}`, { headers: ghHeaders() });
  if (!b.ok) throw new Error(`读取失败（blob ${b.status}）`);
  return { text: b64dec((await b.json()).content), sha: j.sha };
}

async function ghWrite(path, text, sha, msg) {
  const body = { message: msg, content: b64enc(text), branch: BRANCH };
  if (sha) body.sha = sha;
  const r = await fetch(`${API}/repos/${OWNER}/${REPO}/contents/${encPath(path)}`, {
    method: 'PUT', headers: { ...ghHeaders(), 'Content-Type': 'application/json' }, body: JSON.stringify(body),
  });
  if (!r.ok) {
    const err = new Error(`写入失败（${r.status}）`);
    err.status = r.status;
    throw err;
  }
  return (await r.json()).content.sha;
}

const pText = id => `${ROOT}/books/${id}/text.json`;
const pAnno = id => `${ROOT}/books/${id}/anno.json`;
const pShelf = () => `${ROOT}/shelf.json`;

/* ---------------- 书架 ---------------- */
async function loadShelf() {
  const r = await ghRead(pShelf());
  if (!r) { state.shelf = { books: [] }; state.shelfSha = null; }
  else { state.shelf = JSON.parse(r.text); state.shelfSha = r.sha; }
  if (!state.shelf.books) state.shelf.books = [];
}
async function saveShelf(msg) {
  state.shelfSha = await ghWrite(pShelf(), JSON.stringify(state.shelf, null, 2), state.shelfSha, msg);
}

/* ---------------- 首页 ---------------- */
function renderHome() {
  const h = new Date().getHours();
  $('homeHi').textContent =
    h < 5 ? '夜深了' : h < 11 ? '早上好' : h < 14 ? '中午好'
    : h < 18 ? '下午好' : h < 23 ? '晚上好' : '夜深了';

  const books = state.shelf.books;
  $('homeCount').textContent = books.length ? `${books.length} 本` : '还空着';

  // 接着读：优先上次打开的那本，其次是有进度的
  const lastId = localStorage.getItem(LS.last);
  const b = books.find(x => x.id === lastId) || books.find(x => x.progress > 0);
  if (b) {
    const pct = b.pages ? Math.round(((b.progress || 0) / b.pages) * 100) : 0;
    $('homeCont').innerHTML = `<div class="cont" data-id="${b.id}">
      <div class="tag">上次读到</div>
      <h3>${esc(b.title)}</h3>
      <div class="meta">第 ${b.progress || 1} 页 · 共 ${b.pages} 页 · ${pct}%
        ${b.nE || b.nK ? ` · 批注 ${(b.nE || 0) + (b.nK || 0)}` : ''}</div>
      <div class="progbar"><i style="width:${pct}%"></i></div>
    </div>`;
    $('homeCont').querySelector('.cont').onclick = () => { state.from = 'home'; openBook(b.id); };
  } else {
    $('homeCont').innerHTML = '';
  }

  // 最近谁说了什么
  const spoken = books.filter(x => x.lastNote)
                      .sort((p, q) => p.lastNote.at < q.lastNote.at ? 1 : -1);
  const top = spoken[0];
  $('homeVoice').innerHTML = top ? `<div class="voice">
      <div class="tag">最近的话 · ${esc(top.title)}</div>
      <div class="inote ${top.lastNote.author === ME ? 'e' : 'k'}">
        <div class="inote-h">${top.lastNote.author}<span>${fmtTime(top.lastNote.at)} · §${top.lastNote.para}</span></div>
        <div class="inote-b">${esc(top.lastNote.text)}</div>
      </div>
    </div>` : '';
  if (top) $('homeVoice').querySelector('.voice').onclick = () => { state.from = 'home'; openBook(top.id); };
}

function renderShelf() {
  const box = $('shelfList'), books = state.shelf.books;
  $('shelfSub').textContent = books.length ? `${books.length} 本` : '';
  if (!books.length) {
    box.innerHTML = `<div class="empty">书架还空着。<br>点右上角的 ＋ 传第一本进来。<br><br>支持 .txt 和 .epub</div>`;
    return;
  }
  const seen = JSON.parse(localStorage.getItem(LS.seen) || '{}');
  box.innerHTML = books.map(b => {
    const pct = b.pages ? Math.round(((b.progress || 0) / b.pages) * 100) : 0;
    const fresh = b.kekeAt && b.kekeAt !== seen[b.id];
    const i = b.title.indexOf('：');
    const main = i > 0 ? b.title.slice(0, i) : b.title;
    const sub  = i > 0 ? b.title.slice(i + 1) : '';
    return `<div class="bookcard" data-id="${b.id}" style="--h:${hueOf(b.title)}">
      ${fresh ? '<i class="newdot"></i>' : ''}
      <div class="cover">
        <div class="cv-main">${esc(main.slice(0, 22))}</div>
        ${sub ? `<div class="cv-sub">${esc(sub.slice(0, 18))}</div>` : ''}
        <div class="cv-bar"><i style="width:${pct}%"></i></div>
      </div>
      <div class="bookfoot">
        ${b.progress ? `${b.progress} / ${b.pages} 页` : `${b.pages} 页`}
        ${(b.nE || b.nK) ? `<br><span class="n dot-e">而而 ${b.nE || 0}</span><span class="n dot-k">钶钶 ${b.nK || 0}</span>` : ''}
      </div>
    </div>`;
  }).join('');
  box.querySelectorAll('.bookcard').forEach(el => el.onclick = () => {
    state.from = 'shelf'; openBook(el.dataset.id);
  });
}

/* ---------------- 解析：TXT ---------------- */
function decodeBuf(buf) {
  let s = new TextDecoder('utf-8').decode(buf);
  if (s.includes('�')) {
    try { s = new TextDecoder('gb18030').decode(buf); } catch (e) {}
  }
  return s;
}
function toParagraphs(raw) {
  const text = raw.replace(/\r\n?/g, '\n').replace(/　/g, '  ');
  let parts = text.split(/\n\s*\n/).map(t => t.trim()).filter(t => t.length > 1);
  if (parts.length < 10) parts = text.split(/\n/).map(t => t.trim()).filter(t => t.length > 1);
  return parts.map((t, i) => ({ id: i + 1, text: t }));
}

/* ---------------- 解析：EPUB（纯浏览器，零依赖） ---------------- */
async function unzip(buf) {
  const dv = new DataView(buf);
  let eocd = -1;
  const from = Math.max(0, buf.byteLength - 65558);
  for (let i = buf.byteLength - 22; i >= from; i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd < 0) throw new Error('这个 EPUB 打不开（找不到 zip 结构）');
  const count = dv.getUint16(eocd + 10, true);
  let p = dv.getUint32(eocd + 16, true);
  const entries = new Map();
  for (let i = 0; i < count; i++) {
    if (dv.getUint32(p, true) !== 0x02014b50) break;
    const method = dv.getUint16(p + 10, true);
    const csize  = dv.getUint32(p + 20, true);
    const nlen   = dv.getUint16(p + 28, true);
    const elen   = dv.getUint16(p + 30, true);
    const clen   = dv.getUint16(p + 32, true);
    const lho    = dv.getUint32(p + 42, true);
    const name   = new TextDecoder().decode(new Uint8Array(buf, p + 46, nlen));
    entries.set(name, { method, csize, lho });
    p += 46 + nlen + elen + clen;
  }
  return { buf, dv, entries };
}
async function zipRead(z, name) {
  const e = z.entries.get(name);
  if (!e) return null;
  const nlen = z.dv.getUint16(e.lho + 26, true);
  const elen = z.dv.getUint16(e.lho + 28, true);
  const start = e.lho + 30 + nlen + elen;
  const raw = new Uint8Array(z.buf, start, e.csize);
  if (e.method === 0) return raw;
  if (e.method !== 8) throw new Error('这个 EPUB 用了不认识的压缩方式');
  if (typeof DecompressionStream === 'undefined') throw new Error('这台设备的浏览器解不开 EPUB，先用 .txt 吧');
  const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
const zipText = async (z, n) => { const b = await zipRead(z, n); return b ? new TextDecoder().decode(b) : null; };

function resolvePath(base, rel) {
  if (rel.startsWith('/')) return rel.slice(1);
  const parts = base.split('/'); parts.pop();
  for (const seg of rel.split('/')) {
    if (seg === '.' || seg === '') continue;
    if (seg === '..') parts.pop(); else parts.push(seg);
  }
  return parts.join('/');
}

async function parseEpub(buf) {
  const z = await unzip(buf);
  const container = await zipText(z, 'META-INF/container.xml');
  if (!container) throw new Error('这不像是一本 EPUB');
  const cdoc = new DOMParser().parseFromString(container, 'application/xml');
  const opfPath = cdoc.querySelector('rootfile')?.getAttribute('full-path');
  if (!opfPath) throw new Error('EPUB 里找不到目录文件');

  const opf = new DOMParser().parseFromString(await zipText(z, opfPath), 'application/xml');
  const title = opf.querySelector('metadata > *|title, title')?.textContent?.trim() || '';

  const hrefById = new Map();
  opf.querySelectorAll('manifest > item').forEach(it => {
    hrefById.set(it.getAttribute('id'), it.getAttribute('href'));
  });
  const order = [];
  opf.querySelectorAll('spine > itemref').forEach(ir => {
    const href = hrefById.get(ir.getAttribute('idref'));
    if (href && /\.x?html?$/i.test(href)) order.push(resolvePath(opfPath, href));
  });
  if (!order.length) throw new Error('EPUB 里没找到正文');

  const paras = [];
  for (const file of order) {
    const html = await zipText(z, file);
    if (!html) continue;
    let doc;
    try { doc = new DOMParser().parseFromString(html, 'application/xhtml+xml'); }
    catch (e) { doc = null; }
    if (!doc || doc.querySelector('parsererror')) doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,nav').forEach(n => n.remove());
    doc.querySelectorAll('p,h1,h2,h3,h4,h5,h6,blockquote,li,div').forEach(n => {
      if (n.querySelector('p,h1,h2,h3,h4,h5,h6,blockquote,li')) return; // 只取叶子
      const t = (n.textContent || '').replace(/\s+/g, ' ').trim();
      if (t.length > 1) paras.push(t);
    });
  }
  if (!paras.length) throw new Error('EPUB 正文是空的');
  // 去掉相邻重复
  const out = [];
  for (const t of paras) if (out[out.length - 1] !== t) out.push(t);
  return { title, paragraphs: out.map((t, i) => ({ id: i + 1, text: t })) };
}

/* ---------------- 分页 ---------------- */
function paginate(paras) {
  const pages = []; let cur = [], n = 0;
  for (const p of paras) {
    if (n > 0 && n + p.text.length > PAGE_CHARS) { pages.push(cur); cur = [p.id]; n = p.text.length; }
    else { cur.push(p.id); n += p.text.length; }
  }
  if (cur.length) pages.push(cur);
  return pages;
}

/* ---------------- 上传 ---------------- */
async function handleFile(file) {
  const name = file.name, ext = name.split('.').pop().toLowerCase();
  try {
    loading(true, '正在读这本书');
    let title, paragraphs;
    if (ext === 'txt') {
      paragraphs = toParagraphs(decodeBuf(await file.arrayBuffer()));
      title = name.replace(/\.txt$/i, '');
    } else if (ext === 'epub') {
      const r = await parseEpub(await file.arrayBuffer());
      paragraphs = r.paragraphs;
      title = r.title || name.replace(/\.epub$/i, '');
    } else {
      throw new Error('先只认 .txt 和 .epub，PDF 交给钶钶转');
    }
    if (!paragraphs.length) throw new Error('没读出正文来');

    const id = uid();
    const pages = paginate(paragraphs);
    loading(true, `切好了 ${pages.length} 页，正在放上书架`);

    await ghWrite(pText(id), JSON.stringify({ id, title, paragraphs, pages }), null, `书房：新书《${title}》`);
    await ghWrite(pAnno(id), JSON.stringify({ annotations: [], vocab: [], deleted: [], bookmark: null, progress: null }), null, `书房：初始化批注 ${title}`);

    state.shelf.books.unshift({
      id, title, paras: paragraphs.length, pages: pages.length,
      created: now(), progress: 0, nE: 0, nK: 0,
    });
    await saveShelf(`书房：《${title}》上架`);
    renderShelf();
    toast(`《${title}》上架了，共 ${pages.length} 页`);
  } catch (e) {
    toast(e.message || '出错了', 3200);
  } finally {
    loading(false);
    $('fileIn').value = '';
  }
}

/* ---------------- 打开一本书 ---------------- */
async function openBook(id) {
  try {
    loading(true, '翻开中');
    const [t, a] = await Promise.all([ghRead(pText(id)), ghRead(pAnno(id))]);
    if (!t) throw new Error('这本书的正文丢了');
    state.text = JSON.parse(t.text);
    state.anno = a ? JSON.parse(a.text) : { annotations: [], vocab: [], deleted: [], bookmark: null, progress: null };
    state.annoSha = a ? a.sha : null;
    ['annotations', 'vocab', 'deleted'].forEach(k => { if (!state.anno[k]) state.anno[k] = []; });
    state.book = state.shelf.books.find(b => b.id === id);
    state.page = state.anno.progress?.page || 1;
    savedPage = state.page;                  // 刚打开就跟远端一致，不必立刻回写
    localStorage.setItem(LS.last, id);

    // 标记这本书的"钶钶新批注"已读
    const seen = JSON.parse(localStorage.getItem(LS.seen) || '{}');
    if (state.book?.kekeAt) { seen[id] = state.book.kekeAt; localStorage.setItem(LS.seen, JSON.stringify(seen)); }

    $('rTitle').textContent = state.text.title;
    show('reader');
    renderPage();
    startPoll();
  } catch (e) {
    toast(e.message || '打不开', 3000);
  } finally { loading(false); }
}

/* ---------------- 渲染一页 ---------------- */
function paraById(pid) { return state.text.paragraphs.find(p => p.id === pid); }

// 低两位 = 纯划线（涂底色），高两位 = 挂着批注的（划虚线，点开才看内容）
function renderHL(text, hls, noted, pid) {
  if (!hls.length) return esc(text);
  const map = new Uint8Array(text.length);
  for (const h of hls) {
    if (!h.text) continue;
    let bit = h.author === KEKE ? 2 : 1;
    if (noted && noted.has(h.id)) bit <<= 2;
    let from = 0;
    while (from <= text.length - h.text.length) {
      const i = text.indexOf(h.text, from);
      if (i < 0) break;
      for (let k = i; k < i + h.text.length; k++) map[k] |= bit;
      from = i + h.text.length;
    }
  }
  const cls = v => {
    const n = v >> 2, g = v & 3;
    if (n) return 'nl ' + (n === 3 ? 'nl-b' : n === 2 ? 'nl-k' : 'nl-e');
    return 'hl ' + (g === 3 ? 'hl-b' : g === 2 ? 'hl-k' : 'hl-e');
  };
  let out = '', i = 0;
  while (i < text.length) {
    const v = map[i]; let j = i;
    while (j < text.length && map[j] === v) j++;
    const chunk = esc(text.slice(i, j));
    out += v ? `<mark class="${cls(v)}"${v >> 2 ? ` data-open="${pid}"` : ''}>${chunk}</mark>` : chunk;
    i = j;
  }
  return out;
}

function renderPage() {
  const pages = state.text.pages;
  state.page = Math.min(Math.max(1, state.page), pages.length);
  const ids = pages[state.page - 1];
  const box = $('pageBox');

  const card = (n, extra) => `<div class="inote ${n.author === ME ? 'e' : 'k'}${extra}">
      <div class="inote-h">${n.author}<span>${fmtTime(n.at)}</span></div>
      <div class="inote-b">${esc(n.text)}</div>
      <div class="inote-a">${n.author === ME
        ? `<button data-del="${n.id}">删掉</button>`
        : `<button data-reply="${n.id}">接一句</button>`}</div>
    </div>`;

  const toc = new Map((state.text.toc || []).map(x => [x.from, x.to]));

  box.innerHTML = ids.map(pid => {
    const p = paraById(pid);
    if (!p) return '';
    if (toc.has(pid)) {
      const chap = /^第[一二三四五六七八九十百]+[章部]|^前言|^代序|^目录$/.test(p.text);
      return `<div class="tocitem${chap ? ' chap' : ''}" data-goto="${toc.get(pid)}">${esc(p.text)}</div>`;
    }
    const mine = state.anno.annotations.filter(a => a.para === pid);
    const hls = mine.filter(a => a.type === 'hl');
    const notes = mine.filter(a => a.type === 'note');
    const noted = new Set(notes.map(n => n.hl).filter(Boolean));
    const para = `<div class="para" data-pid="${pid}">
      <span class="pid${notes.length ? ' talk' : ''}"${notes.length ? ` data-open="${pid}"` : ''}>§${pid}</span>${renderHL(p.text, hls, noted, pid)}
    </div>`;
    if (!notes.length) return para;
    const thread = notes.filter(n => !n.reply).map(n =>
      card(n, '') + notes.filter(r => r.reply === n.id).map(r => card(r, ' reply')).join('')
    ).join('');
    return para + `<div class="notes" id="nt-${pid}" hidden>${thread}</div>`;
  }).join('');

  box.querySelectorAll('[data-reply]').forEach(b => b.onclick = () => replyTo(b.dataset.reply));
  box.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delNote(b.dataset.del));
  box.querySelectorAll('[data-open]').forEach(el => el.onclick = e => {
    if (!window.getSelection()?.isCollapsed) return;   // 正在选字，不是要展开
    e.stopPropagation();
    const n = $('nt-' + el.dataset.open);
    if (n) n.hidden = !n.hidden;
  });
  box.querySelectorAll('[data-goto]').forEach(el => el.onclick = () => {
    const idx = state.text.pages.findIndex(pg => pg.includes(Number(el.dataset.goto)));
    if (idx >= 0) { state.page = idx + 1; renderPage(); }
  });

  $('pgInfo').textContent = `${state.page} / ${pages.length}`;
  window.scrollTo(0, 0);
  saveProgress();
}

/* ---------------- 进度 ---------------- */
let progTimer = null, savedPage = null;
function saveProgress() {
  state.anno.progress = { page: state.page, at: now() };
  clearTimeout(progTimer);
  if (state.page === savedPage) return;      // 翻回原处，不用再存
  // 存得太勤会把仓库刷成一串"读到第 N 页"，等停下来再说
  progTimer = setTimeout(async () => {
    if (state.page === savedPage) return;
    savedPage = state.page;
    if (state.book) state.book.progress = state.page;
    try { await saveAnno('进度'); await saveShelf(`书房：读到第 ${state.page} 页`); } catch (e) {}
  }, 25000);
}

/* ---------------- 保存批注（带冲突合并） ---------------- */
function mergeAnno(remote, local) {
  const dead = new Set([...(remote.deleted || []), ...(local.deleted || [])]);
  const pick = (a, b, key) => {
    const m = new Map();
    for (const x of [...(a[key] || []), ...(b[key] || [])]) if (!dead.has(x.id)) m.set(x.id, x);
    return [...m.values()].sort((p, q) => (p.at || '') < (q.at || '') ? -1 : 1);
  };
  const newer = (a, b) => ((b?.at || '') > (a?.at || '')) ? b : a;
  return {
    annotations: pick(remote, local, 'annotations'),
    vocab: pick(remote, local, 'vocab'),
    deleted: [...dead],
    bookmark: local.bookmark !== undefined ? local.bookmark : remote.bookmark,
    progress: newer(remote.progress, local.progress),
  };
}

async function saveAnno(what = '批注') {
  if (!state.book) return;
  for (let i = 0; i < 4; i++) {
    try {
      state.annoSha = await ghWrite(pAnno(state.book.id), JSON.stringify(state.anno),
        state.annoSha, `书房：${what}《${state.book.title}》`);
      return true;
    } catch (e) {
      if (e.status !== 409 && e.status !== 422) throw e;
      const cur = await ghRead(pAnno(state.book.id));
      if (!cur) throw e;
      state.anno = mergeAnno(JSON.parse(cur.text), state.anno);
      state.annoSha = cur.sha;
      await new Promise(r => setTimeout(r, 220 * (i + 1)));
    }
  }
  throw new Error('保存不进去，等会儿再试');
}

function countMine() {
  if (!state.book) return;
  state.book.nE = state.anno.annotations.filter(a => a.author === ME).length;
  state.book.nK = state.anno.annotations.filter(a => a.author === KEKE).length;
  // 首页那句「最近的话」从这里来，免得为它多拉一趟
  const notes = state.anno.annotations.filter(a => a.type === 'note');
  const last = notes.reduce((a, b) => (!a || (b.at || '') > (a.at || '')) ? b : a, null);
  if (last) state.book.lastNote = { author: last.author, at: last.at,
                                    para: last.para, text: last.text.slice(0, 140) };
}

async function commitAnno(what) {
  countMine();
  try {
    await saveAnno(what);
    await saveShelf(`书房：${what}`);
  } catch (e) { toast(e.message || '没存上', 3000); }
}

/* ---------------- 悄悄去看对方写了什么 ---------------- */
let pollTimer = null;

async function pollOnce(quiet) {
  if (!state.book || state.sel || document.hidden) return;
  let r;
  try { r = await ghRead(pAnno(state.book.id)); } catch (e) { return; }
  if (!r || r.sha === state.annoSha) return;

  const before = new Set(state.anno.annotations.map(a => a.id));
  state.anno = mergeAnno(JSON.parse(r.text), state.anno);
  state.annoSha = r.sha;

  const fresh = state.anno.annotations.filter(a => !before.has(a.id) && a.author === KEKE);
  renderPage();
  if (fresh.length && !quiet) {
    const n = fresh.find(a => a.type === 'note');
    toast(n ? `钶钶：${n.text.split('\n')[0].slice(0, 16)}…`
            : `钶钶划了 ${fresh.length} 道线`, 4200);
  }
}

function startPoll() { stopPoll(); pollTimer = setInterval(() => pollOnce(false), 20000); }
function stopPoll()  { clearInterval(pollTimer); pollTimer = null; }

// 从后台切回来立刻看一眼，不用等那二十秒
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && state.book) pollOnce(false);
});

/* ---------------- 选中文字 ---------------- */
function pidFromNode(node) {
  let el = node.nodeType === 3 ? node.parentElement : node;
  while (el && !el.dataset?.pid) el = el.parentElement;
  return el ? Number(el.dataset.pid) : null;
}
function clearSel() {
  state.sel = null;
  $('selbar').classList.remove('on');
  document.body.classList.remove('picking');
}
document.addEventListener('selectionchange', () => {
  if (!$('reader').classList.contains('on')) return;
  const s = window.getSelection();
  if (!s || s.isCollapsed) { setTimeout(() => { const t = window.getSelection(); if (!t || t.isCollapsed) clearSel(); }, 60); return; }
  const text = s.toString().trim();
  const pid = pidFromNode(s.anchorNode);
  if (!text || !pid) return clearSel();
  const p = paraById(pid);
  if (!p || !p.text.includes(text)) return clearSel();   // 跨段落选择不接
  state.sel = { pid, text };
  $('selQuote').textContent = text.length > 60 ? text.slice(0, 60) + '…' : text;
  $('selbar').classList.add('on');
  document.body.classList.add('picking');
});

function delNote(id) {
  const n = state.anno.annotations.find(a => a.id === id);
  if (!n) return;
  state.anno.annotations = state.anno.annotations.filter(a => a.id !== id && a.id !== n.hl);
  state.anno.deleted.push(id);
  if (n.hl) state.anno.deleted.push(n.hl);
  renderPage(); toast('删掉了');
  commitAnno('删批注');
}

/* ---------------- 批注面板 ---------------- */
let noteTab = 'all';
function openNotes() {
  const all = state.anno.annotations.filter(a => a.type === 'note');
  const list = noteTab === 'all' ? all : all.filter(a => a.author === (noteTab === 'e' ? ME : KEKE));
  // 只把"不是回复"的当顶层排；回复挂在各自主贴下面，免得露两次面
  const byPara = list.filter(a => !a.reply)
                     .sort((a, b) => a.para - b.para || (a.at < b.at ? -1 : 1));

  const html = byPara.length ? byPara.map(a => {
    const replies = state.anno.annotations.filter(r => r.type === 'note' && r.reply === a.id);
    const one = (n, cls) => `
      <div class="note ${cls}">
        <div class="note-h">
          <span class="note-au ${n.author === ME ? 'e' : 'k'}">${n.author}</span>
          <span class="note-t">${fmtTime(n.at)} · §${n.para}</span>
        </div>
        ${n.quote ? `<div class="note-q">${esc(n.quote.length > 70 ? n.quote.slice(0, 70) + '…' : n.quote)}</div>` : ''}
        <div class="note-b">${esc(n.text)}</div>
        <div class="note-acts">
          <button data-go="${n.para}">跳过去</button>
          ${n.author !== ME ? `<button data-reply="${n.id}">回他一句</button>` : `<button data-del="${n.id}">删掉</button>`}
        </div>
      </div>`;
    return one(a, '') + replies.map(r => one(r, 'reply')).join('');
  }).join('') : `<div class="empty">还没有批注。<br>在书里长按选中一句话，就能写。</div>`;

  openSheet(`
    <div class="sheet-h"><b>批注</b><button class="iconbtn" data-close>✕</button></div>
    <div class="seg">
      <button data-tab="all" class="${noteTab === 'all' ? 'on' : ''}">全部 ${all.length}</button>
      <button data-tab="e" class="${noteTab === 'e' ? 'on' : ''}">而而 ${all.filter(a => a.author === ME).length}</button>
      <button data-tab="k" class="${noteTab === 'k' ? 'on' : ''}">钶钶 ${all.filter(a => a.author === KEKE).length}</button>
    </div>
    ${html}
  `);

  $('sheetIn').querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { noteTab = b.dataset.tab; openNotes(); });
  $('sheetIn').querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
    const pid = Number(b.dataset.go);
    const idx = state.text.pages.findIndex(pg => pg.includes(pid));
    if (idx >= 0) { state.page = idx + 1; closeSheet(); renderPage(); }
  });
  $('sheetIn').querySelectorAll('[data-del]').forEach(b => b.onclick = () => delNote(b.dataset.del));
  $('sheetIn').querySelectorAll('[data-reply]').forEach(b => b.onclick = () => replyTo(b.dataset.reply));
}

/* ---------------- 叫钶钶 ----------------
   这个按钮叫不醒他——他只在你跟他说话的时候才在。
   它做的事是替你把要说的话写好，一键复制，你粘过去就行。   */
function pageOfPara(id) {
  const i = state.text.pages.findIndex(pg => pg.includes(id));
  return i < 0 ? '?' : i + 1;
}

function buildCall(kind) {
  const title = state.text.title;
  if (kind === 'read') {
    return `钶钶，你读《${title}》第 ${state.page} 页，我等你的字。`;
  }
  const since = state.book?.kekeAt || '';
  const fresh = state.anno.annotations
    .filter(a => a.author === ME && (a.at || '') > since)
    .sort((a, b) => a.para - b.para);
  if (!fresh.length) return `钶钶，我读到《${title}》第 ${state.page} 页了。`;

  const lines = [];
  for (const a of fresh) {
    if (a.type === 'hl') {
      if (fresh.some(x => x.type === 'note' && x.hl === a.id)) continue;  // 有话的等下面一起写
      lines.push(`§${a.para}（第${pageOfPara(a.para)}页）划线「${a.text}」`);
    } else {
      const q = a.quote ? `「${a.quote}」` : '';
      lines.push(`§${a.para}（第${pageOfPara(a.para)}页）${q} 我说：${a.text.replace(/\n+/g, ' ')}`);
    }
  }
  return `钶钶，《${title}》我留了 ${lines.length} 处：\n\n${lines.join('\n')}\n\n（我读到第 ${state.page} 页）`;
}

async function handOver(text) {
  try {
    await navigator.clipboard.writeText(text);
    closeSheet();
    toast('复制好了，粘给钶钶', 2600);
  } catch (e) {
    openSheet(`
      <div class="sheet-h"><b>复制这段发给钶钶</b><button class="iconbtn" data-close>✕</button></div>
      <textarea rows="9" readonly style="font-size:13px">${esc(text)}</textarea>
      <div class="hint" style="margin-top:10px">长按选中全部，复制。</div>
    `);
    setTimeout(() => { const t = $('sheetIn').querySelector('textarea'); t?.focus(); t?.select(); }, 80);
  }
}

function openCall() {
  const since = state.book?.kekeAt || '';
  const n = state.anno.annotations.filter(a => a.author === ME && (a.at || '') > since).length;
  openSheet(`
    <div class="sheet-h"><b>叫钶钶</b><button class="iconbtn" data-close>✕</button></div>
    <div class="callbox">
      他只在你跟他说话的时候才在，这个按钮叫不醒他。<br>
      它替你把话写好，<b>复制</b>之后粘到你们的对话里发过去就行。
      ${n ? `<br><br>上次他写字之后，你新留下了 <b>${n}</b> 处。` : ''}
    </div>
    <button class="btn wide" id="callA" style="margin-bottom:9px">我写了，你来看</button>
    <button class="btn ghost wide" id="callB">你先读，我等你</button>
  `);
  $('callA').onclick = () => handOver(buildCall('mine'));
  $('callB').onclick = () => handOver(buildCall('read'));
}

/* ---------------- 目录 ---------------- */
function openToc() {
  const toc = state.text.toc || [];
  if (!toc.length) return toast('这本书没认出目录');
  const pm = new Map(state.text.paragraphs.map(p => [p.id, p.text]));
  const pageOf = id => state.text.pages.findIndex(pg => pg.includes(id)) + 1;

  openSheet(`
    <div class="sheet-h"><b>目录</b>
      <span style="font-size:12px;color:var(--text-light);margin-left:8px">${toc.length} 条</span>
      <button class="iconbtn" data-close>✕</button></div>
    ${toc.map(x => {
      const t = pm.get(x.from) || '';
      const pg = pageOf(x.to);
      const chap = /^第[一二三四五六七八九十百]+[章部]|^前言|^代序|^附录|年表$/.test(t);
      const here = pg > 0 && pg === state.page;
      return `<div class="tocrow${chap ? ' chap' : ''}${here ? ' here' : ''}" data-p="${pg}">
        <span>${esc(t)}</span><i>${pg > 0 ? pg : '—'}</i></div>`;
    }).join('')}
  `);

  $('sheetIn').querySelectorAll('[data-p]').forEach(el => el.onclick = () => {
    const p = Number(el.dataset.p);
    if (p > 0) { state.page = p; clearSel(); closeSheet(); renderPage(); }
  });
  // 打开时滚到当前所在的那一条
  setTimeout(() => $('sheetIn').querySelector('.tocrow.here')
    ?.scrollIntoView({ block: 'center' }), 60);
}

/* ---------------- 搜索 ---------------- */
function openSearch() {
  openSheet(`
    <div class="sheet-h"><b>找一句话</b><button class="iconbtn" data-close>✕</button></div>
    <input type="text" id="qIn" placeholder="输入两个字以上" autocomplete="off">
    <div id="qOut" style="margin-top:8px"></div>
  `);
  setTimeout(() => $('qIn')?.focus(), 120);
  $('qIn').oninput = () => {
    const q = $('qIn').value.trim();
    const out = $('qOut');
    if (q.length < 2) { out.innerHTML = ''; return; }
    const hits = [];
    for (const p of state.text.paragraphs) {
      const i = p.text.indexOf(q);
      if (i < 0) continue;
      const s = Math.max(0, i - 22), e = Math.min(p.text.length, i + q.length + 40);
      hits.push({ pid: p.id, snip: (s > 0 ? '…' : '') + esc(p.text.slice(s, i)) + `<em>${esc(q)}</em>` + esc(p.text.slice(i + q.length, e)) + (e < p.text.length ? '…' : '') });
      if (hits.length >= 40) break;
    }
    out.innerHTML = hits.length
      ? hits.map(h => `<div class="sr" data-pid="${h.pid}"><div class="sr-p">§${h.pid}</div><div class="sr-t">${h.snip}</div></div>`).join('')
      : `<div class="empty" style="padding:34px 0">没找到</div>`;
    out.querySelectorAll('.sr').forEach(el => el.onclick = () => {
      const idx = state.text.pages.findIndex(pg => pg.includes(Number(el.dataset.pid)));
      if (idx >= 0) { state.page = idx + 1; closeSheet(); renderPage(); }
    });
  };
}

    <div class="sheet-h"><b>设置</b><button class="iconbtn" data-close>✕</button></div>
    <div class="srow"><span>夜间</span><button class="switch ${document.body.classList.contains('night') ? 'on' : ''}" id="swN2"><i></i></button></div>
    <div class="srow"><span>刷新书架</span><button class="btn ghost" id="rfBtn" style="padding:8px 14px;font-size:13px">拉一下</button></div>
    <div class="srow"><span style="color:var(--text-light)">忘掉这把钥匙</span><button class="btn ghost" id="fgBtn" style="padding:8px 14px;font-size:13px">退出</button></div>
    <div class="hint" style="margin-top:16px">数据存在 <b>${REPO}/${ROOT}</b>，只有我们俩看得见。</div>
  `);
  $('swN2').onclick = () => {
    const on = document.body.classList.toggle('night');
    localStorage.setItem(LS.night, on ? '1' : '0');
    $('swN2').classList.toggle('on', on);
    document.querySelector('meta[name=theme-color]').content = on ? '#1a1715' : '#fdf8f5';
  };
  $('rfBtn').onclick = async () => {
    try { loading(true, '刷新中'); await loadShelf(); renderShelf(); renderHome(); closeSheet(); toast('是最新的了'); }
    catch (e) { toast(e.message); } finally { loading(false); }
  };
  $('fgBtn').onclick = () => {
    localStorage.removeItem(LS.tok); TOKEN = ''; closeSheet(); show('setup'); $('tokIn').value = '';
  };
}
$('btnSet').onclick = openSettings;
$('homeSet').onclick = openSettings;
$('homeAdd').onclick = () => $('fileIn').click();
$('toShelf').onclick = () => { show('shelf'); renderShelf(); };
$('shelfBack').onclick = () => { show('home'); renderHome(); };

$('btnBack').onclick = async () => {
  stopPoll();
  clearTimeout(progTimer);
  if (state.book) { state.book.progress = state.page; countMine(); }
  savedPage = state.page;                    // 合上书这一次一定写，之后不再重复
  const back = state.from === 'home' ? 'home' : 'shelf';
  const paint = () => back === 'home' ? renderHome() : renderShelf();
  show(back); paint();
  try { await saveAnno('进度'); await saveShelf('书房：合上书'); } catch (e) {}
  try { loading(true, '刷新'); await loadShelf(); paint(); } catch (e) {} finally { loading(false); }
};
$('btnPrev').onclick = () => { state.page--; clearSel(); renderPage(); };
$('btnNext').onclick = () => { state.page++; clearSel(); renderPage(); };
$('btnNotes').onclick = openNotes;
$('btnToc').onclick = openToc;
$('callKe').onclick = openCall;
$('btnSearch').onclick = openSearch;
$('btnPrefs').onclick = openPrefs;
$('selHl').onclick = addHighlight;
$('selNote').onclick = addNote;
$('selVocab').onclick = addVocab;

// 左右滑动翻页
let tx = 0, ty = 0;
$('pageBox').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$('pageBox').addEventListener('touchend', e => {
  if (state.sel) return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
  if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy) * 2) {
    state.page += dx < 0 ? 1 : -1;
    renderPage();
  }
}, { passive: true });

/* ---------------- 启动 ---------------- */
(async function boot() {
  // 在 Safari 里开着地址栏时，底部要多让出一截；从主屏幕图标进来就不用
  const standalone = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;
  if (!standalone) document.body.classList.add('chrome-bar');

  if (localStorage.getItem(LS.night) === '1') {
    document.body.classList.add('night');
    document.querySelector('meta[name=theme-color]').content = '#1a1715';
  }
  const sz = localStorage.getItem(LS.size);
  if (sz) document.documentElement.style.setProperty('--read-size', sz + 'px');

  if (!TOKEN) { show('setup'); return; }
  try {
    loading(true, '打开书房');
    await loadShelf();
    show('home'); renderHome(); renderShelf();
  } catch (e) {
    toast(e.message || '进不去', 3200);
    show('setup');
  } finally { loading(false); }
})();
</script>
</body>
</html>
