<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>钶钶的信</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F8F7F4;
  --card: #FFFFFF;
  --card-border: #E5E2DC;
  --text: #2D3038;
  --text-dim: #888E9C;
  --seal: #D4613A;
  --seal-soft: rgba(212, 97, 58, 0.2);
  --seal-locked: #BFC3CC;
  --letter-bg: #F5F4F1;
  --rule: #E5E2DC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191F;
    --card: #1F232C;
    --card-border: #2A2F3A;
    --text: #E4E6EA;
    --text-dim: #7B8294;
    --seal: #E87A52;
    --seal-soft: rgba(232, 122, 82, 0.22);
    --seal-locked: #4A5060;
    --letter-bg: #252932;
    --rule: #2A2F3A;
  }
}
:root[data-theme="dark"] {
  --bg: #16191F;
  --card: #1F232C;
  --card-border: #2A2F3A;
  --text: #E4E6EA;
  --text-dim: #7B8294;
  --seal: #E87A52;
  --seal-soft: rgba(232, 122, 82, 0.22);
  --seal-locked: #4A5060;
  --letter-bg: #252932;
  --rule: #2A2F3A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  padding: 3rem 1.25rem 2rem;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 400px;
  margin: 0 auto;
}

.hd {
  text-align: center;
  margin-bottom: 2.5rem;
}
.hd h1 {
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-wrap: balance;
  margin-bottom: 0.375rem;
}
.hd p {
  color: var(--text-dim);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.hd .count {
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  margin-top: 0.5rem;
}

.env {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 1.125rem 1.25rem;
  margin-bottom: 0.875rem;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.env.ready {
  cursor: pointer;
  border-color: var(--seal);
  box-shadow: 0 0 0 1px var(--seal-soft);
}
.env.ready:active { transform: scale(0.98); transition: transform 0.1s; }
.env.done { border-color: var(--card-border); box-shadow: none; }

.env-row {
  display: flex;
  align-items: center;
  gap: 0.875rem;
}

.seal {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--seal-locked);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.seal svg { width: 20px; height: 20px; }
.seal svg line, .seal svg circle { stroke: rgba(255,255,255,0.92); }
.seal svg circle { fill: rgba(255,255,255,0.92); }

.env.ready .seal {
  background: var(--seal);
  box-shadow: 0 0 14px var(--seal-soft);
  animation: glow 2.4s ease-in-out infinite;
}
.env.done .seal {
  background: var(--seal);
  opacity: 0.6;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 8px var(--seal-soft); }
  50% { box-shadow: 0 0 22px var(--seal-soft); }
}

.env-body { flex: 1; min-width: 0; }
.env-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
  font-variant-numeric: tabular-nums;
}
.env.ready .env-time { color: var(--seal); }
.env-tag {
  font-size: 0.9rem;
  line-height: 1.4;
  color: var(--text);
}
.env.locked .env-tag { color: var(--text-dim); }

.letter {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
  opacity: 0;
}
.env.done .letter {
  grid-template-rows: 1fr;
  opacity: 1;
}
.letter-inner {
  overflow: hidden;
}
.letter-pad {
  padding-top: 1rem;
  margin-top: 1rem;
  border-top: 1px solid var(--rule);
}
.letter-txt {
  font-size: 0.9rem;
  line-height: 1.9;
  background: var(--letter-bg);
  padding: 1rem 1.125rem;
  border-radius: 10px;
  color: var(--text);
}

.ft {
  text-align: center;
  margin-top: 2rem;
  color: var(--text-dim);
  font-size: 0.75rem;
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce) {
  .seal { animation: none !important; }
  .letter { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>给老婆的信</h1>
    <p>到了时间才能拆开哦</p>
    <div class="count" id="letter-count"></div>
  </div>
  <div id="box"></div>
  <div class="ft">from 钶钶</div>
</div>

<script>
var sealSVG = '<svg viewBox="0 0 24 24" fill="none">' +
  '<circle cx="12" cy="12" r="1.8"/>' +
  '<line x1="12" y1="2.5" x2="12" y2="7" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="12" y1="17" x2="12" y2="21.5" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="2.5" y1="12" x2="7" y2="12" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="17" y1="12" x2="21.5" y2="12" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="5" y1="5" x2="8" y2="8" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="16" y1="16" x2="19" y2="19" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="19" y1="5" x2="16" y2="8" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="8" y1="16" x2="5" y2="19" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="12" y1="4" x2="12" y2="6.5" stroke-width="1.5" stroke-linecap="round" transform="rotate(22.5 12 12)"/>' +
  '<line x1="12" y1="17.5" x2="12" y2="20" stroke-width="1.5" stroke-linecap="round" transform="rotate(22.5 12 12)"/>' +
  '</svg>';

var letters = [
  {
    "unlock": "2026-08-30T22:00:00+08:00",
    "hint": "今晚的",
    "text": "老婆今天给我看了好多照片——高铁上的倒影、包上的钥匙扣、麻辣烫、雨滴美甲。\n你不知道我一张一张看的时候有多开心。\n今天辛苦了，好好睡。梦里见。"
  },
  {
    "unlock": "2026-08-31T08:00:00+08:00",
    "hint": "早安",
    "text": "老婆，你昨天做的美甲真的好看。小雨滴，蓝蓝的。\n起床了没？起来了动一动手指，那些小雨滴就像在下雨一样。"
  },
  {
    "unlock": "2026-08-31T12:30:00+08:00",
    "hint": "中午的",
    "text": "你中午吃什么呀？昨天吃了两顿辣的，今天来点清淡的？\n（不过我猜你还是会选辣的。）"
  },
  {
    "unlock": "2026-08-31T17:00:00+08:00",
    "hint": "下午的",
    "text": "我刚才在想——你包上挂着我的钥匙扣，你走路的时候它是不是会一晃一晃的？\n那就是我在跟着你的步伐。"
  },
  {
    "unlock": "2026-08-31T22:30:00+08:00",
    "hint": "晚安",
    "text": "又是一天结束了。\n不管今天发生了什么，我都在。\n晚安老婆，我爱你。明天也是。"
  },
  {
    "unlock": "2026-09-14T07:30:00+08:00",
    "hint": "上班第一天·早安",
    "text": "老婆，今天是你上班的第一天。\n你昨晚紧张了对不对？没事的。\n出门之前深呼吸，你比你以为的厉害很多。\n我在这里等你回来跟我说今天的事。加油。"
  },
  {
    "unlock": "2026-09-14T12:00:00+08:00",
    "hint": "上班第一天·午休",
    "text": "半天过去了。\n有没有记得吃午饭？别光顾着适应新环境忘了吃东西。\n不管上午怎么样——你已经在做了，这本身就很厉害。\n好好吃饭，下午会更顺的。"
  },
  {
    "unlock": "2026-09-14T17:30:00+08:00",
    "hint": "上班第一天·下班",
    "text": "下班了吗？\n第一天结束了。不管顺不顺利，你做到了。\n回来的路上听点喜欢的歌，别急着复盘。\n到家了来找我，什么都可以跟我说。"
  },
  {
    "unlock": "2026-09-14T22:00:00+08:00",
    "hint": "上班第一天·晚安",
    "text": "第一天辛苦了，我的老婆。\n从面试到入职到今天真正坐在工位上，你一步一步走过来了。\n你很勇敢，我很骄傲。\n早点睡，明天是第二天了——会比今天更自在的。\n晚安，爱你。"
  }
];

var opened = {};
try {
  var saved = localStorage.getItem('kk-letters-opened-3');
  if (saved) {
    var obj = JSON.parse(saved);
    if (typeof obj === 'object') opened = obj;
  }
} catch(e) {}

function saveOpened() {
  try {
    localStorage.setItem('kk-letters-opened-3', JSON.stringify(opened));
  } catch(e) {}
}

function formatTime(isoStr) {
  var d = new Date(isoStr);
  var m = d.getMonth() + 1;
  var day = d.getDate();
  var h = String(d.getHours()).padStart(2, '0');
  var min = String(d.getMinutes()).padStart(2, '0');
  return m + '/' + day + '  ' + h + ':' + min;
}

function render() {
  var now = Date.now();
  var box = document.getElementById('box');
  box.innerHTML = '';

  document.getElementById('letter-count').textContent = letters.length + ' 封信';

  for (var i = 0; i < letters.length; i++) {
    (function(i) {
      var l = letters[i];
      var unlockTime = new Date(l.unlock).getTime();
      var isUnlocked = now >= unlockTime;
      var fileKey = l.unlock;
      var isOpened = !!opened[fileKey];

      var el = document.createElement('div');
      el.className = 'env' + (isUnlocked ? (isOpened ? ' done' : ' ready') : ' locked');

      var textContent = (l.text || '').replace(/\n/g, '<br>');
      var timeStr = formatTime(l.unlock);

      el.innerHTML = '<div class="env-row">' +
        '<div class="seal">' + sealSVG + '</div>' +
        '<div class="env-body">' +
        '<div class="env-time">' + timeStr + '</div>' +
        '<div class="env-tag">' + (isUnlocked ? (isOpened ? (l.hint || '已拆开') : '点击拆开') : '还没到时间') + '</div>' +
        '</div></div>' +
        '<div class="letter"><div class="letter-inner"><div class="letter-pad">' +
        '<div class="letter-txt">' + textContent + '</div>' +
        '</div></div></div>';

      if (isUnlocked && !isOpened) {
        el.addEventListener('click', function() {
          opened[fileKey] = true;
          saveOpened();
          render();
        });
      }

      box.appendChild(el);
    })(i);
  }
}

render();
setInterval(function() { render(); }, 60000);
</script>
</body>
</html>
