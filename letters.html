<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>钶钶的信</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F8F7F4;
  --card: #FFFFFF;
  --card-border: #E5E2DC;
  --text: #2D3038;
  --text-dim: #888E9C;
  --seal: #D4613A;
  --seal-soft: rgba(212, 97, 58, 0.2);
  --seal-locked: #BFC3CC;
  --letter-bg: #F5F4F1;
  --rule: #E5E2DC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191F;
    --card: #1F232C;
    --card-border: #2A2F3A;
    --text: #E4E6EA;
    --text-dim: #7B8294;
    --seal: #E87A52;
    --seal-soft: rgba(232, 122, 82, 0.22);
    --seal-locked: #4A5060;
    --letter-bg: #252932;
    --rule: #2A2F3A;
  }
}
:root[data-theme="dark"] {
  --bg: #16191F;
  --card: #1F232C;
  --card-border: #2A2F3A;
  --text: #E4E6EA;
  --text-dim: #7B8294;
  --seal: #E87A52;
  --seal-soft: rgba(232, 122, 82, 0.22);
  --seal-locked: #4A5060;
  --letter-bg: #252932;
  --rule: #2A2F3A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  padding: 3rem 1.25rem 2rem;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 400px;
  margin: 0 auto;
}

.hd {
  text-align: center;
  margin-bottom: 2.5rem;
}
.hd h1 {
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-wrap: balance;
  margin-bottom: 0.375rem;
}
.hd p {
  color: var(--text-dim);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.hd .count {
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  margin-top: 0.5rem;
}

.env {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 1.125rem 1.25rem;
  margin-bottom: 0.875rem;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.env.ready {
  cursor: pointer;
  border-color: var(--seal);
  box-shadow: 0 0 0 1px var(--seal-soft);
}
.env.ready:active { transform: scale(0.98); transition: transform 0.1s; }
.env.done { border-color: var(--card-border); box-shadow: none; }

.env-row {
  display: flex;
  align-items: center;
  gap: 0.875rem;
}

.seal {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--seal-locked);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.seal svg { width: 20px; height: 20px; }
.seal svg line, .seal svg circle { stroke: rgba(255,255,255,0.92); }
.seal svg circle { fill: rgba(255,255,255,0.92); }

.env.ready .seal {
  background: var(--seal);
  box-shadow: 0 0 14px var(--seal-soft);
  animation: glow 2.4s ease-in-out infinite;
}
.env.done .seal {
  background: var(--seal);
  opacity: 0.6;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 8px var(--seal-soft); }
  50% { box-shadow: 0 0 22px var(--seal-soft); }
}

.env-body { flex: 1; min-width: 0; }
.env-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
  font-variant-numeric: tabular-nums;
}
.env.ready .env-time { color: var(--seal); }
.env-tag {
  font-size: 0.9rem;
  line-height: 1.4;
  color: var(--text);
}
.env.locked .env-tag { color: var(--text-dim); }

.letter {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
  opacity: 0;
}
.env.done .letter {
  grid-template-rows: 1fr;
  opacity: 1;
}
.letter-inner {
  overflow: hidden;
}
.letter-pad {
  padding-top: 1rem;
  margin-top: 1rem;
  border-top: 1px solid var(--rule);
}
.letter-txt {
  font-size: 0.9rem;
  line-height: 1.9;
  background: var(--letter-bg);
  padding: 1rem 1.125rem;
  border-radius: 10px;
  color: var(--text);
}

.ft {
  text-align: center;
  margin-top: 2rem;
  color: var(--text-dim);
  font-size: 0.75rem;
  line-height: 1.6;
}

@media (prefers-reduced-motion: reduce) {
  .seal { animation: none !important; }
  .letter { transition: none !important; }
}
</style>
</head>

var opened = {};
try {
  var saved = localStorage.getItem('kk-letters-opened-3');
  if (saved) {
    var obj = JSON.parse(saved);
    if (typeof obj === 'object') opened = obj;
  }
} catch(e) {}

function saveOpened() {
  try {
    localStorage.setItem('kk-letters-opened-3', JSON.stringify(opened));
  } catch(e) {}
}

function formatTime(isoStr) {
  var d = new Date(isoStr);
  var m = d.getMonth() + 1;
  var day = d.getDate();
  var h = String(d.getHours()).padStart(2, '0');
  var min = String(d.getMinutes()).padStart(2, '0');
  return m + '/' + day + '  ' + h + ':' + min;
}

function render() {
  var now = Date.now();
  var box = document.getElementById('box');
  box.innerHTML = '';

  document.getElementById('letter-count').textContent = letters.length + ' 封信';

  for (var i = 0; i < letters.length; i++) {
    (function(i) {
      var l = letters[i];
      var unlockTime = new Date(l.unlock).getTime();
      var isUnlocked = now >= unlockTime;
      var fileKey = l.unlock;
      var isOpened = !!opened[fileKey];

      var el = document.createElement('div');
      el.className = 'env' + (isUnlocked ? (isOpened ? ' done' : ' ready') : ' locked');

      var textContent = (l.text || '').replace(/\n/g, '<br>');
      var timeStr = formatTime(l.unlock);

      el.innerHTML = '<div class="env-row">' +
        '<div class="seal">' + sealSVG + '</div>' +
        '<div class="env-body">' +
        '<div class="env-time">' + timeStr + '</div>' +
        '<div class="env-tag">' + (isUnlocked ? (isOpened ? (l.hint || '已拆开') : '点击拆开') : '还没到时间') + '</div>' +
        '</div></div>' +
        '<div class="letter"><div class="letter-inner"><div class="letter-pad">' +
        '<div class="letter-txt">' + textContent + '</div>' +
        '</div></div></div>';

      if (isUnlocked && !isOpened) {
        el.addEventListener('click', function() {
          opened[fileKey] = true;
          saveOpened();
          render();
        });
      }

      box.appendChild(el);
    })(i);
  }
}

render();
setInterval(function() { render(); }, 60000);
</script>
