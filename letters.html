<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>钶钶的信</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&display=swap">
<style>
:root {
  --bg: #F8F7F4;
  --card: #FFFFFF;
  --card-border: #E5E2DC;
  --text: #2D3038;
  --text-dim: #888E9C;
  --seal: #D4613A;
  --seal-soft: rgba(212, 97, 58, 0.2);
  --seal-locked: #BFC3CC;
  --letter-bg: #F5F4F1;
  --rule: #E5E2DC;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16191F;
    --card: #1F232C;
    --card-border: #2A2F3A;
    --text: #E4E6EA;
    --text-dim: #7B8294;
    --seal: #E87A52;
    --seal-soft: rgba(232, 122, 82, 0.22);
    --seal-locked: #4A5060;
    --letter-bg: #252932;
    --rule: #2A2F3A;
  }
}
:root[data-theme="dark"] {
  --bg: #16191F;
  --card: #1F232C;
  --card-border: #2A2F3A;
  --text: #E4E6EA;
  --text-dim: #7B8294;
  --seal: #E87A52;
  --seal-soft: rgba(232, 122, 82, 0.22);
  --seal-locked: #4A5060;
  --letter-bg: #252932;
  --rule: #2A2F3A;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  min-height: 100vh;
  padding: 3rem 1.25rem 2rem;
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 400px;
  margin: 0 auto;
}

.hd {
  text-align: center;
  margin-bottom: 2.5rem;
}
.hd h1 {
  font-size: 1.375rem;
  font-weight: 600;
  letter-spacing: 0.03em;
  text-wrap: balance;
  margin-bottom: 0.375rem;
}
.hd p {
  color: var(--text-dim);
  font-size: 0.8125rem;
  line-height: 1.5;
}
.hd .count {
  color: var(--text-dim);
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  margin-top: 0.5rem;
}

.env {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 1.125rem 1.25rem;
  margin-bottom: 0.875rem;
  position: relative;
  transition: border-color 0.3s, box-shadow 0.3s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.env.ready {
  cursor: pointer;
  border-color: var(--seal);
  box-shadow: 0 0 0 1px var(--seal-soft);
}
.env.ready:active { transform: scale(0.98); transition: transform 0.1s; }
.env.done { border-color: var(--card-border); box-shadow: none; }

.env-row {
  display: flex;
  align-items: center;
  gap: 0.875rem;
}

.seal {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--seal-locked);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}
.seal svg { width: 20px; height: 20px; }
.seal svg line, .seal svg circle { stroke: rgba(255,255,255,0.92); }
.seal svg circle { fill: rgba(255,255,255,0.92); }

.env.ready .seal {
  background: var(--seal);
  box-shadow: 0 0 14px var(--seal-soft);
  animation: glow 2.4s ease-in-out infinite;
}
.env.done .seal {
  background: var(--seal);
  opacity: 0.6;
}

@keyframes glow {
  0%, 100% { box-shadow: 0 0 8px var(--seal-soft); }
  50% { box-shadow: 0 0 22px var(--seal-soft); }
}

.env-body { flex: 1; min-width: 0; }
.env-time {
  font-family: 'DM Mono', monospace;
  font-size: 0.75rem;
  font-weight: 500;
  color: var(--text-dim);
  margin-bottom: 0.2rem;
  font-variant-numeric: tabular-nums;
}
.env.ready .env-time { color: var(--seal); }
.env-tag {
  font-size: 0.9rem;
  line-height: 1.4;
  color: var(--text);
}
.env.locked .env-tag { color: var(--text-dim); }

.letter {
  display: grid;
  grid-template-rows: 0fr;
  transition: grid-template-rows 0.45s ease, opacity 0.35s ease;
  opacity: 0;
}
.env.done .letter {
  grid-template-rows: 1fr;
  opacity: 1;
}
.letter-inner {
  overflow: hidden;
}
.letter-pad {
  padding-top: 1rem;
  margin-top: 1rem;
  border-top: 1px solid var(--rule);
}
.letter-txt {
  font-size: 0.9rem;
  line-height: 1.9;
  background: var(--letter-bg);
  padding: 1rem 1.125rem;
  border-radius: 10px;
  color: var(--text);
}

.loading {
  text-align: center;
  color: var(--text-dim);
  font-size: 0.875rem;
  padding: 2rem 0;
}

.ft {
  text-align: center;
  margin-top: 2rem;
  color: var(--text-dim);
  font-size: 0.75rem;
  line-height: 1.6;
}

.refresh-btn {
  display: block;
  margin: 1.5rem auto 0;
  background: none;
  border: 1px solid var(--card-border);
  color: var(--text-dim);
  font-size: 0.75rem;
  padding: 0.5rem 1.25rem;
  border-radius: 8px;
  cursor: pointer;
}
.refresh-btn:active { opacity: 0.6; }

.key-box {
  background: var(--card);
  border: 1px solid var(--card-border);
  border-radius: 14px;
  padding: 1.25rem;
  margin-bottom: 1.5rem;
  text-align: center;
}
.key-box p {
  color: var(--text-dim);
  font-size: 0.8125rem;
  margin-bottom: 0.75rem;
  line-height: 1.5;
}
.key-input {
  width: 100%;
  padding: 0.625rem 0.875rem;
  border: 1px solid var(--card-border);
  border-radius: 8px;
  background: var(--letter-bg);
  color: var(--text);
  font-size: 0.875rem;
  outline: none;
  margin-bottom: 0.625rem;
}
.key-input:focus { border-color: var(--seal); }
.key-save {
  background: var(--seal);
  color: #fff;
  border: none;
  border-radius: 8px;
  padding: 0.5rem 1.5rem;
  font-size: 0.8125rem;
  cursor: pointer;
}
.key-save:active { opacity: 0.7; }
.key-saved {
  color: var(--text-dim);
  font-size: 0.75rem;
  margin-top: 0.5rem;
  cursor: pointer;
}

@media (prefers-reduced-motion: reduce) {
  .seal { animation: none !important; }
  .letter { transition: none !important; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <h1>给老婆的信</h1>
    <p>到了时间才能拆开哦</p>
    <div class="count" id="letter-count"></div>
  </div>
  <div id="key-area"></div>
  <div id="box"><div class="loading">正在取信…</div></div>
  <div class="ft">from 钶钶</div>
  <button class="refresh-btn" onclick="loadLetters()">刷新</button>
</div>

<script>
var sealSVG = '<svg viewBox="0 0 24 24" fill="none">' +
  '<circle cx="12" cy="12" r="1.8"/>' +
  '<line x1="12" y1="2.5" x2="12" y2="7" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="12" y1="17" x2="12" y2="21.5" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="2.5" y1="12" x2="7" y2="12" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="17" y1="12" x2="21.5" y2="12" stroke-width="2.2" stroke-linecap="round"/>' +
  '<line x1="5" y1="5" x2="8" y2="8" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="16" y1="16" x2="19" y2="19" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="19" y1="5" x2="16" y2="8" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="8" y1="16" x2="5" y2="19" stroke-width="2" stroke-linecap="round"/>' +
  '<line x1="12" y1="4" x2="12" y2="6.5" stroke-width="1.5" stroke-linecap="round" transform="rotate(22.5 12 12)"/>' +
  '<line x1="12" y1="17.5" x2="12" y2="20" stroke-width="1.5" stroke-linecap="round" transform="rotate(22.5 12 12)"/>' +
  '</svg>';

var OWNER = 'ererhere';
var REPO = 'CLAUDE.md';
var BRANCH = 'main';
var LETTERS_PATH = 'diary/data/letters';
var LS_KEY = 'kkee_diary_token';

var TOKEN = '';
try { TOKEN = localStorage.getItem(LS_KEY) || ''; } catch(e) {}

function showKeyUI() {
  var area = document.getElementById('key-area');
  if (TOKEN) {
    area.innerHTML = '<div class="key-saved" onclick="showKeyInput()">换钥匙</div>';
    return;
  }
  showKeyInput();
}

function showKeyInput() {
  var area = document.getElementById('key-area');
  area.innerHTML = '<div class="key-box">' +
    '<p>输入钥匙才能取信哦<br>和日记本同一把</p>' +
    '<input class="key-input" id="key-val" type="password" placeholder="粘贴钥匙">' +
    '<br><button class="key-save" onclick="saveKey()">确定</button>' +
    '</div>';
}

async function saveKey() {
  var v = document.getElementById('key-val').value.trim();
  if (!v) return;
  var old = TOKEN;
  TOKEN = v;
  try {
    var testUrl = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + LETTERS_PATH + '?ref=' + BRANCH;
    var testRes = await fetch(testUrl, { headers: { Authorization: 'token ' + v } });
    if (!testRes.ok) throw new Error(testRes.status);
    try { localStorage.setItem(LS_KEY, v); } catch(e) {}
    showKeyUI();
    loadLetters();
  } catch(e) {
    TOKEN = old;
    alert('钥匙不对或没有权限（' + e.message + '），试试别的？');
  }
}

showKeyUI();

var letters = [];
var opened = {};
try {
  var saved = localStorage.getItem('kk-letters-opened-3');
  if (saved) {
    var obj = JSON.parse(saved);
    if (typeof obj === 'object') opened = obj;
  }
} catch(e) {}

function saveOpened() {
  try {
    localStorage.setItem('kk-letters-opened-3', JSON.stringify(opened));
  } catch(e) {}
}

function formatTime(isoStr) {
  var d = new Date(isoStr);
  var m = d.getMonth() + 1;
  var day = d.getDate();
  var h = String(d.getHours()).padStart(2, '0');
  var min = String(d.getMinutes()).padStart(2, '0');
  return m + '/' + day + '  ' + h + ':' + min;
}

async function githubGet(path) {
  var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + path + '?ref=' + BRANCH;
  var res = await fetch(url, { headers: { Authorization: 'token ' + TOKEN } });
  if (res.status === 404) return null;
  if (!res.ok) throw new Error('GitHub ' + res.status);
  return res.json();
}

async function loadLetters() {
  var box = document.getElementById('box');

  if (!TOKEN) {
    box.innerHTML = '<div class="loading">需要先输入钥匙</div>';
    return;
  }

  box.innerHTML = '<div class="loading">正在取信…</div>';

  try {
    var url = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + LETTERS_PATH + '?ref=' + BRANCH;
    var res = await fetch(url, { headers: { Authorization: 'token ' + TOKEN } });

    if (!res.ok) {
      box.innerHTML = '<div class="loading">读不到信（' + res.status + '）</div>';
      return;
    }

    var listing = await res.json();

    if (!listing || !Array.isArray(listing) || listing.length === 0) {
      box.innerHTML = '<div class="loading">还没有信</div>';
      return;
    }

    var jsonFiles = listing.filter(function(f) {
      return f.name.endsWith('.json');
    });

    var promises = jsonFiles.map(function(f) {
      var fUrl = 'https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/' + LETTERS_PATH + '/' + f.name + '?ref=' + BRANCH;
      return fetch(fUrl, { headers: { Authorization: 'token ' + TOKEN } }).then(function(r) {
        if (!r.ok) return null;
        return r.json();
      }).then(function(data) {
        if (!data || !data.content) return null;
        try {
          var decoded = decodeURIComponent(escape(atob(data.content.replace(/\s/g, ''))));
          var letter = JSON.parse(decoded);
          letter._file = f.name;
          return letter;
        } catch(e) { return null; }
      }).catch(function() { return null; });
    });

    var results = await Promise.all(promises);
    letters = results.filter(function(l) { return l !== null; });

    letters.sort(function(a, b) {
      return new Date(a.unlock).getTime() - new Date(b.unlock).getTime();
    });

    var countEl = document.getElementById('letter-count');
    countEl.textContent = letters.length + ' 封信';

    render();
  } catch(e) {
    box.innerHTML = '<div class="loading">读不到信：' + e.message + '</div>';
  }
}

function render() {
  var now = Date.now();
  var box = document.getElementById('box');
  box.innerHTML = '';

  for (var i = 0; i < letters.length; i++) {
    (function(i) {
      var l = letters[i];
      var unlockTime = new Date(l.unlock).getTime();
      var isUnlocked = now >= unlockTime;
      var fileKey = l._file;
      var isOpened = !!opened[fileKey];

      var el = document.createElement('div');
      el.className = 'env' + (isUnlocked ? (isOpened ? ' done' : ' ready') : ' locked');

      var textContent = (l.text || '').replace(/\\n/g, '\n').replace(/\n/g, '<br>');
      var timeStr = formatTime(l.unlock);

      el.innerHTML = '<div class="env-row">' +
        '<div class="seal">' + sealSVG + '</div>' +
        '<div class="env-body">' +
        '<div class="env-time">' + timeStr + '</div>' +
        '<div class="env-tag">' + (isUnlocked ? (isOpened ? (l.hint || '已拆开') : '点击拆开') : '还没到时间') + '</div>' +
        '</div></div>' +
        '<div class="letter"><div class="letter-inner"><div class="letter-pad">' +
        '<div class="letter-txt">' + textContent + '</div>' +
        '</div></div></div>';

      if (isUnlocked && !isOpened) {
        el.addEventListener('click', function() {
          opened[fileKey] = true;
          saveOpened();
          render();
        });
      }

      box.appendChild(el);
    })(i);
  }
}

loadLetters();
setInterval(function() { if (letters.length > 0) render(); }, 60000);
</script>
</body>
</html>
